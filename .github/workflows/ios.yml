# Облачная сборка на macOS: тесты ядра MonoKit и неподписанный .ipa для установки через Sideloadly / AltStore.
name: iOS build

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: MonoKit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: swift test
        working-directory: Packages/MonoKit
        run: swift test

  app:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build for iPhone (without signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoFinance.xcodeproj \
            -scheme MonoFinance \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' | head -300
      - name: Error summary
        if: failure()
        run: grep -E 'error:' build.log | sort -u | head -200 || true
      - name: Publish build log to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci
          sed "s|$GITHUB_WORKSPACE/||g" build.log > /tmp/ci/build.log || true
          grep -E ' error: | warning: ' /tmp/ci/build.log | sort -u > /tmp/ci/errors.txt || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          BR=ci-logs; [ "$GITHUB_REF_NAME" != main ] && BR="ci-logs-$GITHUB_REF_NAME"
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI log ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MonoFinance.app Payload/
          zip -qry MonoFinance.ipa Payload
          ls -lh MonoFinance.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonoFinance-ipa
          path: MonoFinance.ipa
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MonoFinance.ipa \
            --prerelease \
            --title "MONO — последняя сборка" \
            --notes "Неподписанный .ipa для установки через Sideloadly (Windows/macOS). Коммит ${GITHUB_SHA::7}."

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoFinance.xcodeproj \
            -scheme MonoFinance \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' | head -200
      - name: Capture screens
        run: |
          APP=build-sim/Build/Products/Debug-iphonesimulator/MonoFinance.app
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone 1[6-9] Pro \(' | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep 'iPhone' | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}'); fi
          echo "Device: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          # Первый запуск после установки медленнее — прогреваем приложение, чтобы первый снимок не был пустым.
          xcrun simctl launch "$UDID" uz.mono.finance -AppleLanguages "(ru)" -AppleLocale ru_RU -monoScreenshots || true
          sleep 15
          mkdir -p shots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" uz.mono.finance >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" uz.mono.finance -AppleLanguages "(ru)" -AppleLocale ru_RU -monoScreenshots "$@" || true
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
          }
          shoot 01-overview -monoTab overview
          shoot 01b-overview-middle -monoTab overview -monoScroll center
          shoot 01c-overview-bottom -monoTab overview -monoScroll bottom
          shoot 02-transactions -monoTab transactions
          shoot 03-analytics -monoTab analytics
          shoot 03b-analytics-middle -monoTab analytics -monoScroll center
          shoot 03c-analytics-bottom -monoTab analytics -monoScroll bottom
          shoot 04-plans -monoTab plans
          shoot 04b-plans-bottom -monoTab plans -monoScroll bottom
          shoot 05-voice -monoVoice "Сегодня потратил 120 тысяч на такси и 75 тысяч на кофе с карты Капиталбанка"
          shoot 06-account -monoRoute account
          shoot 07-expense -monoSheet expense
          shoot 08-assistant -monoSheet assistant
          shoot 09-settings -monoRoute settings
          shoot 10-onboarding -monoOnboarding
          shoot 11-import -monoSheet import
          shoot 12-goal -monoRoute goal
          shoot 13-accounts -monoRoute accounts
          shoot 14-transaction -monoRoute transaction
          shoot 15-categories -monoRoute categories
          shoot 16-transfer -monoSheet transfer
          ls -la shots
      - name: Publish screenshots to ci-shots branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/shots
          cp -R shots/. /tmp/shots/ 2>/dev/null || true
          sed "s|$GITHUB_WORKSPACE/||g" sim.log | grep -E ' error: | warning: ' | sort -u > /tmp/shots/sim-errors.txt || true
          echo "${GITHUB_SHA}" > /tmp/shots/commit.txt
          cd /tmp/shots
          BR=ci-shots; [ "$GITHUB_REF_NAME" != main ] && BR="ci-shots-$GITHUB_REF_NAME"
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
