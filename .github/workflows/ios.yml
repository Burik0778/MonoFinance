# Облачная сборка на macOS: тесты ядра MonoKit и неподписанный .ipa для установки через Sideloadly / AltStore.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: MonoKit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: swift test
        working-directory: Packages/MonoKit
        run: swift test

  app:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build for iPhone (without signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MonoFinance.xcodeproj \
            -scheme MonoFinance \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E 'error:|BUILD SUCCEEDED|BUILD FAILED' | head -300
      - name: Error summary
        if: failure()
        run: grep -E 'error:' build.log | sort -u | head -200 || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MonoFinance.app Payload/
          zip -qry MonoFinance.ipa Payload
          ls -lh MonoFinance.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonoFinance-ipa
          path: MonoFinance.ipa
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MonoFinance.ipa \
            --prerelease \
            --title "MONO — последняя сборка" \
            --notes "Неподписанный .ipa для установки через Sideloadly (Windows/macOS). Коммит ${GITHUB_SHA::7}."
